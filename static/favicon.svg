<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CampusWatt mark: a battery cell fused with a dispatch bolt on a dark tile.
       Edge-independent: safe in the browser tab at 16px, crisp at 512px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2340"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#aab4ff"/>
      <stop offset="1" stop-color="#7d8bff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b53a"/>
      <stop offset="1" stop-color="#d99a17"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <!-- battery shell -->
  <rect x="13" y="18" width="34" height="30" rx="5" fill="none"
        stroke="#2dd4bf" stroke-width="3" opacity="0.9"/>
  <!-- battery terminal -->
  <rect x="47.5" y="27" width="4.5" height="12" rx="2" fill="#2dd4bf" opacity="0.9"/>

  <!-- dispatch bolt -->
  <path d="M34.5 22 L23 36.5 h7.5 L28 44 L41 28.5 h-8 Z"
        fill="url(#bolt)"/>

  <!-- charge arc (solar intake) -->
  <path d="M16 52 q16 6 32 0" fill="none" stroke="url(#leaf)"
        stroke-width="3" stroke-linecap="round" opacity="0.95"/>
</svg>